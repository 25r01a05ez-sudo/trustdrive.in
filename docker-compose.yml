version: "3.9"

services:
  postgres:
    image: postgres:16-alpine
    container_name: trustdrive-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: trustdrive
      POSTGRES_PASSWORD: trustdrive
      POSTGRES_DB: trustdrive
    ports:
      - "5432:5432"
    volumes:
      - trustdrive_pgdata:/var/lib/postgresql/data

volumes:
  trustdrive_pgdata:
